# Gradle configuration for Oriental Instrument Android app

# Gradle daemon memory
org.gradle.jvmargs=-Xmx4096m

# Enable Gradle build cache
org.gradle.caching=true

# Build configuration
org.gradle.parallel=true
org.gradle.workers.max=8

# Enable Gradle incremental compilation
org.gradle.incremental=true

# Android-specific
android.useAndroidX=true
android.enableJetifier=true

# Enable native build (CMake + NDK)
android.cmake.c_standard=c17
android.cmake.cppFlags=-std=c++17

# Suppress warnings during build
gradle.configureondemand=true
