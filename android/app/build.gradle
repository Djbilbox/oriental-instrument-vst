apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    compileSdkVersion 34
    ndkVersion '26.0.10792818'  // LTS NDK version

    defaultConfig {
        applicationId = 'com.djbilbox.orientalinstrument'
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName '1.0.0'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        // CMake integration for C++ build
        externalNativeBuild {
            cmake {
                arguments '-DANDROID=ON',
                          '-DORIENTAL_DEMO_ANDROID=ON',
                          '-DCMAKE_BUILD_TYPE=Release',
                          '-DANDROID_PLATFORM=android-21'
            }
        }
    }

    // Configure CMake for native C++ build
    externalNativeBuild {
        cmake {
            version '3.22.1'
            path '../../CMakeLists.txt'
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }

        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Signing configuration (configure in local.properties or via CI/CD)
            // signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    packagingOptions {
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
    }

    // Source layout
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDir 'src/main/java'
            kotlin.srcDir 'src/main/kotlin'
            res.srcDir 'src/main/res'
            assets.srcDir 'src/main/assets'
            jniLibs.srcDir 'src/main/jniLibs'
        }
    }
}

dependencies {
    // Kotlin stdlib
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Google Play Billing Library (for IAP)
    implementation 'com.android.billingclient:billing:6.0.1'

    // Google Play Services (optional: for analytics, ads, etc.)
    implementation 'com.google.android.gms:play-services-base:18.2.0'

    // Logging
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Gradle build cache (improve build times)
gradle.taskGraph.whenReady { taskGraph ->
    if (taskGraph.hasTask(':app:packageRelease')) {
        println "Building RELEASE version of Oriental Instrument Android"
    }
}
