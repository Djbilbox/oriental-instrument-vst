name: Build iOS IPA

on:
  push:
    branches: [ feature/refonte-dsp-ui, main ]
  pull_request:
    branches: [ feature/refonte-dsp-ui, main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Clone JUCE
      run: |
        if [ ! -d "JUCE" ]; then
          git clone --depth 1 https://github.com/juce-framework/JUCE.git
        fi

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.22.1'

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Create build directory
      run: mkdir -p build-ios

    - name: Configure CMake (iOS)
      run: |
        cd build-ios
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
          -DCMAKE_OSX_SYSROOT=iphoneos \
          ..

    - name: Build iOS (Release)
      run: |
        cd build-ios
        cmake --build . --config Release --target OrientalInstrumentiOS

    - name: Build iOS (Demo)
      run: |
        cd build-ios
        cmake --build . --config Release --target OrientalInstrumentiOS_Demo

    - name: Create IPA (Release)
      run: |
        cd build-ios
        # Package app as IPA
        mkdir -p Payload
        cp -r Release/Oriental\ Instrument.app Payload/
        zip -r Oriental_Instrument_Release.ipa Payload/
        rm -rf Payload

    - name: Create IPA (Demo)
      run: |
        cd build-ios
        # Package app as IPA
        mkdir -p Payload
        cp -r Release/Oriental\ Instrument\ Demo.app Payload/
        zip -r Oriental_Instrument_Demo.ipa Payload/
        rm -rf Payload

    - name: Upload IPA artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ios-ipas
        path: |
          build-ios/Oriental_Instrument_Release.ipa
          build-ios/Oriental_Instrument_Demo.ipa

    - name: Upload to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build-ios/Oriental_Instrument_Release.ipa
          build-ios/Oriental_Instrument_Demo.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
