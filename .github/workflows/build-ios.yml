name: Build iOS IPA

on:
  push:
    branches: [ feature/refonte-dsp-ui, main ]
  pull_request:
    branches: [ feature/refonte-dsp-ui, main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Clone JUCE
      run: |
        if [ ! -d "JUCE" ]; then
          git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git
        fi

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.22.1'

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Create build directory
      run: mkdir -p build-ios

    - name: Configure CMake (iOS)
      run: |
        cd build-ios
        cmake -G Xcode \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
          -DCMAKE_OSX_SYSROOT=iphoneos \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          ..

    - name: Build iOS (Release, unsigned)
      run: |
        cd build-ios
        cmake --build . --config Release --target OrientalInstrumentiOS -- \
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

    - name: Create IPA (unsigned)
      run: |
        cd build-ios
        APP=$(find . -name "*.app" -type d | head -1)
        echo "Found app: $APP"
        if [ -z "$APP" ]; then echo "No .app produced"; exit 1; fi
        mkdir -p Payload
        cp -r "$APP" Payload/
        zip -r Oriental_Instrument_unsigned.ipa Payload/
        rm -rf Payload

    - name: Upload IPA artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa-unsigned
        path: build-ios/Oriental_Instrument_unsigned.ipa

    - name: Upload to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build-ios/Oriental_Instrument_Release.ipa
          build-ios/Oriental_Instrument_Demo.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
