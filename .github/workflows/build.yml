name: Build Oriental Instrument VST3

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone JUCE framework
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE

      - name: Verify project structure
        shell: bash
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== JUCE present? ==="
          ls JUCE/CMakeLists.txt && echo "OK: JUCE found"
          echo "=== Source dir ==="
          ls Source/

      - name: Configure CMake (Release)
        # No hardcoded generator: let CMake auto-detect the Visual Studio
        # generation installed on the runner (robust to windows-latest moving
        # from VS2022 to VS2025). -A x64 stays valid for any VS generator.
        run: cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3 (full)
        run: cmake --build build --config Release --target OrientalInstrument_VST3

      - name: Build VST3 (DEMO)
        run: cmake --build build --config Release --target OrientalInstrumentDemo_VST3

      - name: Locate full VST3 artifact
        id: find_vst3
        shell: bash
        run: |
          VST3_PATH=$(find build -name "Oriental Instrument.vst3" -type d | head -1)
          if [ -z "$VST3_PATH" ]; then
            echo "ERROR: No full .vst3 bundle found!"
            find build -type d -name "*.vst3"
            exit 1
          fi
          echo "vst3_path=$VST3_PATH" >> $GITHUB_OUTPUT
          echo "Found full VST3 at: $VST3_PATH"

      - name: Locate DEMO VST3 artifact
        id: find_demo
        shell: bash
        run: |
          DEMO_PATH=$(find build -name "Oriental Instrument DEMO.vst3" -type d | head -1)
          if [ -z "$DEMO_PATH" ]; then
            echo "ERROR: No DEMO .vst3 bundle found!"
            find build -type d -name "*.vst3"
            exit 1
          fi
          echo "demo_path=$DEMO_PATH" >> $GITHUB_OUTPUT
          echo "Found DEMO VST3 at: $DEMO_PATH"

      - name: Upload full VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrientalInstrument-VST3-Win64
          path: ${{ steps.find_vst3.outputs.vst3_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload DEMO VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrientalInstrument-DEMO-VST3-Win64
          path: ${{ steps.find_demo.outputs.demo_path }}
          if-no-files-found: error
          retention-days: 90

  build-macos:
    runs-on: macos-14
    timeout-minutes: 40
    permissions:
      contents: write   # publish Release so installer zips are publicly downloadable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: true   # pull packaging/samples.zip for all-in-one DMG

      - name: Clone JUCE framework
        run: git clone --depth 1 --branch 8.0.4 https://github.com/juce-framework/JUCE.git JUCE

      - name: Configure CMake (Release, universal)
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build VST3 (full)
        run: cmake --build build --config Release --target OrientalInstrument_VST3

      - name: Build VST3 (DEMO)
        run: cmake --build build --config Release --target OrientalInstrumentDemo_VST3

      - name: Locate full VST3 artifact
        id: find_vst3
        run: |
          VST3_PATH=$(find build -name "Oriental Instrument.vst3" -type d | head -1)
          if [ -z "$VST3_PATH" ]; then
            echo "ERROR: No full .vst3 bundle found!"
            find build -type d -name "*.vst3"
            exit 1
          fi
          echo "vst3_path=$VST3_PATH" >> $GITHUB_OUTPUT
          echo "Found full VST3 at: $VST3_PATH"

      - name: Locate DEMO VST3 artifact
        id: find_demo
        run: |
          DEMO_PATH=$(find build -name "Oriental Instrument DEMO.vst3" -type d | head -1)
          if [ -z "$DEMO_PATH" ]; then
            echo "ERROR: No DEMO .vst3 bundle found!"
            find build -type d -name "*.vst3"
            exit 1
          fi
          echo "demo_path=$DEMO_PATH" >> $GITHUB_OUTPUT
          echo "Found DEMO VST3 at: $DEMO_PATH"

      - name: Upload full VST3 artifact (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: OrientalInstrument-VST3-macOS
          path: ${{ steps.find_vst3.outputs.vst3_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Upload DEMO VST3 artifact (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: OrientalInstrument-DEMO-VST3-macOS
          path: ${{ steps.find_demo.outputs.demo_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Build all-in-one DMGs (Full encrypted + Demo)
        id: dmg
        run: |
          chmod +x packaging/build_dmg.sh
          set -o pipefail
          (
            set -x
            # FULL — samples bundled + AES-256 password (bundle) + pro docs
            bash packaging/build_dmg.sh "${{ steps.find_vst3.outputs.vst3_path }}" \
              "Oriental-Instrument-macOS-FULL.dmg" "packaging/samples.zip" "DJBILBOX-ORIENT-2026" \
              "packaging/docs/PRESENTATION_BUNDLE.txt" "packaging/docs/LICENSE_BUNDLE.txt"
            # DEMO — samples bundled, no password (free) + demo docs
            bash packaging/build_dmg.sh "${{ steps.find_demo.outputs.demo_path }}" \
              "Oriental-Instrument-macOS-DEMO.dmg" "packaging/samples.zip" "" \
              "packaging/docs/PRESENTATION_DEMO.txt" "packaging/docs/LICENSE_DEMO.txt"
          ) 2>&1 | tee dmg_build.log

      - name: Publish DMG build log (always, public)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create installers-v1.0.0 --title "Oriental Instrument Installers v1.0.0" \
            --notes "build logs + installers" || true
          gh release upload installers-v1.0.0 dmg_build.log --clobber || true

      - name: Package macOS release zips
        run: |
          cat > PASSWORD.txt <<'EOF'
          ===========================================
             ORIENTAL INSTRUMENT - BUNDLE (FULL) macOS
             by DJBILBOX BEATS
          ===========================================
          Mot de passe / password (DMG chiffre AES-256):

                  DJBILBOX-ORIENT-2026

          Double-clique le .dmg, entre le mot de passe,
          puis suis INSTALLATION.txt a l'interieur.
          www.djbilboxbeats.com
          ===========================================
          EOF
          mkdir -p release_mac
          cp "Oriental-Instrument-macOS-FULL.dmg" PASSWORD.txt \
             packaging/docs/PRESENTATION_BUNDLE.txt packaging/docs/LICENSE_BUNDLE.txt release_mac/
          (cd release_mac && zip -9 ../OrientalInstrument-macOS-FULL.zip \
             "Oriental-Instrument-macOS-FULL.dmg" PASSWORD.txt PRESENTATION_BUNDLE.txt LICENSE_BUNDLE.txt)
          mkdir -p release_demo
          cp "Oriental-Instrument-macOS-DEMO.dmg" \
             packaging/docs/PRESENTATION_DEMO.txt packaging/docs/LICENSE_DEMO.txt release_demo/
          (cd release_demo && zip -9 ../OrientalInstrument-macOS-DEMO.zip \
             "Oriental-Instrument-macOS-DEMO.dmg" PRESENTATION_DEMO.txt LICENSE_DEMO.txt)

      - name: Upload macOS FULL installer zip
        uses: actions/upload-artifact@v4
        with:
          name: OrientalInstrument-macOS-FULL
          path: OrientalInstrument-macOS-FULL.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload macOS DEMO installer zip
        uses: actions/upload-artifact@v4
        with:
          name: OrientalInstrument-macOS-DEMO
          path: OrientalInstrument-macOS-DEMO.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish Release (public download, no auth needed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="installers-v1.0.0"
          NOTES="Oriental Instrument VST3 — all-in-one installers by DJBILBOX BEATS. macOS Full DMG is AES-256 encrypted (password in PASSWORD.txt)."
          gh release create "$TAG" --title "Oriental Instrument Installers v1.0.0" --notes "$NOTES" \
            OrientalInstrument-macOS-FULL.zip OrientalInstrument-macOS-DEMO.zip \
          || gh release upload "$TAG" \
            OrientalInstrument-macOS-FULL.zip OrientalInstrument-macOS-DEMO.zip --clobber
