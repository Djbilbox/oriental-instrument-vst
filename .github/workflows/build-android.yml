name: Build Android APK

on:
  push:
    branches: [ feature/refonte-dsp-ui, main ]
  pull_request:
    branches: [ feature/refonte-dsp-ui, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Clone JUCE
      run: |
        if [ ! -d "JUCE" ]; then
          git clone --depth 1 --branch 7.0.12 https://github.com/juce-framework/JUCE.git
        fi

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK + CMake + platforms
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0" \
                   "ndk;26.0.10792818" "cmake;3.22.1" "platform-tools"

    - name: Configure local.properties
      run: |
        cd android
        cat > local.properties << EOF
        sdk.dir=$ANDROID_SDK_ROOT
        ndk.dir=$ANDROID_SDK_ROOT/ndk/26.0.10792818
        cmake.dir=$ANDROID_SDK_ROOT/cmake/3.22.1
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Android (Debug)
      working-directory: android
      run: gradle assembleDebug --stacktrace --no-daemon

    - name: Locate APK
      if: always()
      run: find android -name "*.apk" -type f || true

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk-debug
        path: android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
