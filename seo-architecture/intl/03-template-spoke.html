<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{META_DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL_URL}}">
<meta name="robots" content="index,follow,max-image-preview:large">
<!-- hreflang -->
<link rel="alternate" hreflang="en" href="{{HREF_EN}}">
<link rel="alternate" hreflang="fr" href="{{HREF_FR}}">
<link rel="alternate" hreflang="x-default" href="{{HREF_DEFAULT}}">
<!-- Open Graph -->
<meta property="og:type" content="{{OG_TYPE}}">
<meta property="og:title" content="{{PAGE_TITLE}}">
<meta property="og:description" content="{{META_DESCRIPTION}}">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta name="twitter:card" content="summary_large_image">

<!-- ===== INLINED CRITICAL CSS — zero render-blocking, target 100/100 PageSpeed ===== -->
<style>
:root{--bg:#0a0a0f;--surf:#14141c;--line:#262633;--txt:#e8e8f0;--mut:#9a9ab0;--acc:#ff3d54;--acc2:#6c4cff}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font:16px/1.65 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
header.top{position:sticky;top:0;z-index:9;background:rgba(10,10,15,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:auto;display:flex;gap:1.5rem;align-items:center;padding:.8rem 1.2rem}
.bar a{color:var(--mut);font-size:.9rem}.bar .brand{color:var(--txt);font-weight:700;margin-right:auto}
nav.crumb{max-width:1180px;margin:auto;padding:.7rem 1.2rem;font-size:.82rem;color:var(--mut)}
.wrap{max-width:1180px;margin:auto;display:grid;grid-template-columns:230px 1fr;gap:2.5rem;padding:1rem 1.2rem 4rem}
aside.toc{position:sticky;top:84px;align-self:start;font-size:.88rem}
aside.toc strong{display:block;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-size:.7rem;margin-bottom:.6rem}
aside.toc a{display:block;color:var(--mut);padding:.32rem 0;border-left:2px solid var(--line);padding-left:.8rem}
aside.toc a:hover,aside.toc a.on{color:var(--txt);border-left-color:var(--acc);text-decoration:none}
main h1{font-size:2.2rem;line-height:1.15;margin:.4rem 0 1rem;background:linear-gradient(90deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
main h2{font-size:1.45rem;margin:2.6rem 0 .8rem;scroll-margin-top:84px}
main h3{font-size:1.1rem;margin:1.6rem 0 .5rem}
main p,main li{color:#d2d2e0}
.hero-cta{display:inline-block;background:var(--acc);color:#fff;font-weight:700;padding:.85rem 1.6rem;border-radius:8px;margin:.4rem .5rem .4rem 0}
.hero-cta.ghost{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.store{border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:1rem;margin:1.4rem 0}
.store iframe{width:100%;border:0;border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:1rem 0}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:1.1rem}
details{border-bottom:1px solid var(--line);padding:.7rem 0}details summary{cursor:pointer;font-weight:600}
.lead{display:flex;gap:.6rem;flex-wrap:wrap;background:var(--surf);border:1px solid var(--acc2);border-radius:12px;padding:1.2rem;margin:2rem 0;align-items:center}
.lead input{flex:1;min-width:180px;padding:.7rem;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--txt)}
footer{border-top:1px solid var(--line);color:var(--mut);font-size:.85rem;text-align:center;padding:2rem 1rem}
@media(max-width:820px){.wrap{grid-template-columns:1fr}aside.toc{display:none}.bar a:not(.brand){display:none}}
</style>
</head>
<body>

<header class="top"><div class="bar">
  <a class="brand" href="/">DJBILBOX BEATS</a>
  <a href="/vst-plugins/">VST Plugins</a>
  <a href="/beats/">Beats</a>
  <a href="/web-dev-music/">Web Dev</a>
  <a href="#lead" class="hero-cta" style="padding:.45rem 1rem">Get a Quote</a>
</div></header>

<nav class="crumb" aria-label="Breadcrumb">{{BREADCRUMB_HTML}}</nav>

<div class="wrap">

  <!-- ===== SIDEBAR DYNAMIC TABLE OF CONTENTS ===== -->
  <aside class="toc" aria-label="On this page">
    <strong>On this page</strong>
    {{TOC_LINKS}}
  </aside>

  <main>
    <h1>{{H1}}</h1>
    <p class="intro">{{INTRO_PARAGRAPH}}</p>
    <a href="#lead" class="hero-cta">{{CTA_PRIMARY}}</a>
    <a href="{{CTA_SECONDARY_HREF}}" class="hero-cta ghost">{{CTA_SECONDARY}}</a>

    <!-- ===== BEAT STORE / INTERACTIVE PLAYER ZONE ===== -->
    <section id="store" class="store" aria-label="Beat store">
      <h2 style="margin-top:.2rem">{{STORE_HEADING}}</h2>
      <!-- Beatstars / Spotify / custom player embed -->
      <iframe src="{{PLAYER_EMBED_URL}}" height="340" loading="lazy" title="{{STORE_HEADING}}"></iframe>
    </section>

    {{BODY_SECTIONS}}

    <!-- ===== LEAD CAPTURE ===== -->
    <form id="lead" class="lead" action="{{LEAD_ENDPOINT}}" method="post">
      <input name="email" type="email" required placeholder="you@studio.com">
      <input name="project" placeholder="Project (plugin / beats / website)">
      <button class="hero-cta" type="submit">{{CTA_PRIMARY}}</button>
    </form>

    <h2>FAQ</h2>
    {{FAQ_ITEMS}}
  </main>
</div>

<footer>© <span id="y"></span> DJBILBOX BEATS — Paris · Toulouse · Worldwide · <a href="/vst-plugins/">VST</a> · <a href="/beats/">Beats</a> · <a href="/web-dev-music/">Web</a></footer>

<!-- tiny JS: scroll-spy TOC + year. No framework. -->
<script>
document.getElementById('y').textContent=new Date().getFullYear();
var ls=[].slice.call(document.querySelectorAll('aside.toc a')),hs=ls.map(function(a){return document.querySelector(a.getAttribute('href'))});
addEventListener('scroll',function(){var y=scrollY+90,i=hs.length;while(--i>=0){if(hs[i]&&hs[i].offsetTop<=y){ls.forEach(function(a){a.classList.remove('on')});ls[i].classList.add('on');break}}},{passive:true});
</script>

<!-- ===== NESTED JSON-LD: Product (VST) x MusicGroup (production) x ProfessionalService (web/dev) ===== -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "BreadcrumbList",
      "itemListElement": {{SCHEMA_BREADCRUMB_ITEMS}}
    },
    {
      "@type": "Product",
      "@id": "{{CANONICAL_URL}}#product",
      "name": "{{PRODUCT_NAME}}",
      "description": "{{PRODUCT_DESC}}",
      "brand": {"@type":"Brand","name":"DJBILBOX BEATS"},
      "category": "{{CATEGORY}}"
      {{OFFERS_BLOCK}}
    },
    {
      "@type": "MusicGroup",
      "@id": "https://djbilboxbeats.com/#musicgroup",
      "name": "DJBILBOX BEATS",
      "url": "https://djbilboxbeats.com/",
      "genre": {{SCHEMA_GENRES}},
      "foundingLocation": {"@type":"Place","name":"Paris, France"},
      "areaServed": ["US","GB","FR","DE","AE","Worldwide"]
    },
    {
      "@type": "ProfessionalService",
      "@id": "https://djbilboxbeats.com/#service",
      "name": "DJBILBOX BEATS — Audio Plugin & Music Web Engineering",
      "url": "{{CANONICAL_URL}}",
      "serviceType": "{{SERVICE_TYPE}}",
      "provider": {"@id":"https://djbilboxbeats.com/#musicgroup"},
      "areaServed": ["Paris","Toulouse","London","Los Angeles","Atlanta","Berlin","Dubai","Worldwide"],
      "knowsAbout": ["C++","JUCE","DSP","VST3","AU","beatmaking","music web development"]
    },
    {
      "@type": "FAQPage",
      "mainEntity": {{SCHEMA_FAQ_ITEMS}}
    }
  ]
}
</script>

</body>
</html>
